<title>Tic Tac Toe</title>
<meta charset="UTF-8" />

<style>
  body,
  td,
  input {
    font-size: 24px;
    line-height: 1.5;
    text-align: center;
    font-family: system-ui, sans-serif;
  }
  td {
    height: 3rem;
    width: 3rem;
    text-align: center;
  }
  table {
    margin: 5rem auto;
  }
  @media (prefers-color-scheme: dark) {
    body,
    input {
      background: #222;
      color: #ccc;
    }
  }
</style>

<h1>Tic Tac Toe</h1>

<table>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
</table>

<h2 hidden>Game over, refresh to play again 🧑‍💻 🤖!</h2>

<script>
  // Cache DOM elements and define winning combinations
  const boxes = Array.from(document.querySelectorAll("td"));
  const inputs = Array.from(document.querySelectorAll("[type=checkbox]"));
  
  const rows = [1, 2, 3].map((n) =>
    Array.from(document.querySelectorAll(`tr:nth-child(${n}) td`))
  );
  
  const columns = [1, 2, 3].map((n) =>
    Array.from(document.querySelectorAll(`td:nth-child(${n})`))
  );
  
  const diagonals = [
    [[1, 1], [2, 2], [3, 3]],
    [[3, 1], [2, 2], [1, 3]],
  ].map((set) =>
    set.map(([x, y]) =>
      document.querySelector(`tr:nth-child(${x}) td:nth-child(${y})`)
    )
  );

  const gameOver = document.querySelector("h2");
  const HUMAN = "🧑‍💻";
  const ROBOT = "🤖";

  // Randomly decide who takes the first turn
  if (Math.random() > 0.5) {
    runRobotTurn();
  }

  // Bind click handlers to all available board inputs
  for (const input of inputs) {
    input.addEventListener("click", handleClickInput);
  }

  // Handle the human move, check for a win, and trigger the robot response if needed
  function handleClickInput(evt) {
    evt.target.closest("td").innerHTML = HUMAN;
    
    if (hasWin()) {
      return endGame();
    }
    
    runRobotTurn();
    
    if (hasWin()) {
      return endGame();
    }
  }

  // Pick a random available cell and mark it for the robot
  function runRobotTurn() {
    const robotBoxes = shuffle(boxes);
    
    for (const box of robotBoxes) {
      if (box.querySelector("input")) {
        box.innerHTML = ROBOT;
        break;
      }
    }
  }

  // Check if any winning line condition has been met
  function hasWin() {
    return (
      rows.some(hasAllSame) ||
      columns.some(hasAllSame) ||
      diagonals.some(hasAllSame)
    );
  }

  // Verify if all cells in a line belong to the same player and are claimed
  function hasAllSame(arr) {
    return arr.every(
      (td) => !td.querySelector("input") && td.innerHTML === arr[0].innerHTML
    );
  }

  // Reveal the game over message and clean up remaining input listeners
  function endGame() {
    gameOver.hidden = false;
    
    for (const input of inputs) {
      input.removeEventListener("click", handleClickInput);
      input.remove();
    }
  }

  // Return a randomized shallow copy of an array using Fisher-Yates logic
  function shuffle(array) {
    const copy = array.slice(0);
    
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = copy[i];
      copy[i] = copy[j];
      copy[j] = temp;
    }
    
    return copy;
  }
</script>
